{% extends 'base.html' %}

{% block title %}Visualizacion{% endblock %}

{% block content %}

<ul>
    {% for todo in todos %}
        <li class="{{ 'done' if todo['completed'] else 'pending' }}">{{ todo["title"] }} - <a href="{{ url_for('todo.detalle', todo_id=todo['todo_id']) }}">Ver detalle</a></li>
    {% endfor %}
</ul>

{% endblock %}
